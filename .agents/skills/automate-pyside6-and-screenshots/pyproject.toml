[project]
name = "pyqtauto"
version = "0.1.0"
description = "Playwright-like automation library for PySide6 applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "pyside6>=6.5.0",
]

[project.scripts]
pyqtauto = "pyqtauto.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyqtauto"]
