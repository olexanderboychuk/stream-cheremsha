[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-cheremsha"
version = "0.1.0"
description = "MVP Twitch/YouTube live chat to Ukrainian TTS for streamers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "twitchio>=2.10,<3",
    "TikTokLive>=6.6.5",
    "PySide6>=6.7",
    "qasync>=0.27",
    "httpx>=0.27",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "keyring>=25",
    "piper-tts>=1.3.0",
    # CPU runtime for Piper; explicit so PyInstaller / wheels bundle ORT predictably.
    "onnxruntime>=1.16",
    # Without a floor, pip may pick an old numpy sdist on some platforms and fail to build.
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Nuitka 4.x is known to crash on some dependency graphs (e.g. librosa); pin to 2.x/3.x line.
build = ["nuitka>=2.4,<4.0", "ordered-set>=4.1", "zstandard>=0.22", "pillow>=10"]
# RVC: ``rvc-python`` — ``--no-deps`` (піни faiss/numpy). Не ``fairseq==0.12.2`` з PyPI: на Py3.11
# падає з ``dataclasses``; fork ``fairseq-fixed`` той самий ``import fairseq`` і підтримка 3.11+.
# Після оновлення зі старого fairseq: ``pip uninstall -y fairseq`` потім ``pip install -e ".[rvc]"``.
# pyworld на Linux — sdist; на Fedora: ``dnf install python3.11-devel gcc-c++``.
rvc = [
    "av",
    "fairseq-fixed>=0.12.3.1",
    "ffmpeg-python",
    "loguru",
    "praat-parselmouth>=0.4.2",
    "pydantic>=1,<3",
    "pyworld",
    "soundfile",
    "scipy>=1.10.0",
    "torchcrepe",
    "torch>=2.0",
    "torchaudio>=2.0",
    "requests",
    "faiss-cpu>=1.8.0",
    # rvc-python package API/CLI; optional, не ламає мінімальний infer:
    "fastapi",
    "uvicorn",
    "python-multipart",
]
# CUDA (Piper): несумісно додавати onnxruntime-gpu як extra разом з onnxruntime.
# Для GPU: pip uninstall onnxruntime && pip install onnxruntime-gpu (окремий venv / окрема збірка).

[project.scripts]
cheremsha = "stream_cheremsha.app.main:main"
cheremsha-install-rvc = "stream_cheremsha.install_rvc:main"
cheremsha-bootstrap-rvc = "stream_cheremsha.bootstrap_rvc:main"
cheremsha-build = "stream_cheremsha.build_nuitka:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Piper voice .onnx (+ .json) dropped into data/piper/ are shipped with the app (optional).
stream_cheremsha = ["data/piper/*", "qml/*", "assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
