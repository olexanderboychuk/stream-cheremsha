[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-cheremsha"
version = "0.12.0"
description = "MVP Twitch/YouTube live chat to Ukrainian TTS for streamers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "twitchio>=2.10,<3",
    "TikTokLive==7.0.0b1",
    "PySide6>=6.7",
    "PySideSix-Frameless-Window>=0.8.0",
    "qasync>=0.27",
    # Local overlay server (OBS browser source URLs).
    "aiohttp>=3.10",
    "pyngrok>=7.2",
    "httpx>=0.27",
    # Telegram bot (song requests).
    "python-telegram-bot>=21.0",
    # Genius.com lyrics for TikTok Live song screening.
    "lyricsgenius>=3.0",
    # Local music playback (YouTube download).
    "yt-dlp>=2025.1.1",
    "edge-tts>=6.1",
    "google-api-python-client>=2.0",
    "chat-downloader>=0.2.0",
    "google-auth-oauthlib>=1.0",
    "keyring>=25",
    # OBS Studio WebSocket v5 (scene switch, source visibility).
    "obsws-python>=1.6,<2",
    # Without a floor, pip may pick an old numpy sdist on some platforms and fail to build.
    "numpy>=1.26.0",
    # Global keyboard/mouse simulation for Actions (cross-platform; Linux needs X11 for best results).
    "pynput>=1.7.7",
    # Interception driver Python wrapper (Windows low-level input for games; wheel is platform-neutral).
    "interception-python>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "pre-commit>=4.6.0"]
# Memory profiling (line-by-line RSS; Windows needs psutil).
profile = ["memory-profiler>=0.61", "psutil>=5.9"]
# Plotting for mprof (optional; heavy dependency).
profile-plot = ["matplotlib>=3.8"]
# Nuitka: we build with standalone mode. If a specific version regresses on your
# dependency graph, pin it in the environment (e.g. `pip install nuitka==...`).
build = ["nuitka==4.0.8", "ordered-set>=4.1", "zstandard>=0.22", "pillow>=10"]

[project.scripts]
cheremsha = "stream_cheremsha.app.main:main"
cheremsha-build = "stream_cheremsha.build_nuitka:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stream_cheremsha = ["qml/*", "assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


