name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows (Nuitka + NSIS)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies (build)
        run: uv sync --extra build --frozen

      - name: Validate version matches tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag
          if ($tagVersion.StartsWith("v")) { $tagVersion = $tagVersion.Substring(1) }
          uv run --frozen python scripts/ci/validate_release_version.py --tag-version "$tagVersion"

      - name: Build (Nuitka standalone)
        env:
          STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_TOKEN }}
          STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_HOSTNAME: ${{ secrets.STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_HOSTNAME }}
        run: uv run --frozen cheremsha-build --out dist/nuitka --low-memory --jobs 1

      - name: Print Nuitka version
        shell: pwsh
        run: uv run --frozen python -m nuitka --version

      - name: Ensure Windows icon.ico for NSIS
        shell: pwsh
        run: uv run --frozen python scripts/ci/ensure_windows_icon_ico.py

      - name: Locate Nuitka dist folder
        id: nuitka
        shell: pwsh
        run: |
          $distRoot = Resolve-Path "dist/nuitka"
          $distDir = Get-ChildItem -Path $distRoot -Directory | Where-Object { $_.Name -like "*.dist" } | Select-Object -First 1
          if (-not $distDir) {
            Write-Error "Could not find Nuitka *.dist folder under $distRoot"
            exit 1
          }
          $exe = Join-Path $distDir.FullName "cheremsha.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected cheremsha.exe at: $exe"
            exit 1
          }
          "dist_dir=$($distDir.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/release" | Out-Null
          $tag = "${{ github.ref_name }}"
          $zip = "dist/release/Cheremsha-$tag-windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "${{ steps.nuitka.outputs.dist_dir }}\*" -DestinationPath $zip

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag
          if ($tagVersion.StartsWith("v")) { $tagVersion = $tagVersion.Substring(1) }
          New-Item -ItemType Directory -Force -Path "dist/release" | Out-Null
          $out = Join-Path (Resolve-Path "dist/release").Path "Cheremsha-Setup-$tag.exe"
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not (Test-Path $makensis)) {
            Write-Error "makensis not found after NSIS install"
            exit 1
          }
          & $makensis `
            "/DAPP_VERSION=$tagVersion" `
            "/DINPUT_DIR=${{ steps.nuitka.outputs.dist_dir }}" `
            "/DOUTPUT_EXE=$out" `
            "build/nsis/cheremsha.nsi"
          if (-not (Test-Path $out)) {
            Write-Error "NSIS output not found: $out"
            exit 1
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/release/*

  linux:
    name: Linux (Nuitka + AppImage)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (PySide6 + build)
        run: |
          for repo in /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*; do
            if [ -e "$repo" ]; then
              sudo mv "$repo" "${repo}.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            file \
            libegl1 \
            libfuse2 \
            libgl1 \
            libpulse0 \
            libxkbcommon0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            patchelf \
            wget

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install dependencies (build)
        run: uv sync --extra build --frozen

      - name: Validate version matches tag
        run: |
          tag="${{ github.ref_name }}"
          tag_version="${tag#v}"
          uv run --frozen python scripts/ci/validate_release_version.py --tag-version "$tag_version"

      - name: Build (Nuitka standalone)
        env:
          STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_TOKEN }}
          STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_HOSTNAME: ${{ secrets.STREAM_CHEREMSHA_CLOUDFLARE_TUNNEL_HOSTNAME }}
        run: uv run --frozen cheremsha-build --out dist/nuitka --low-memory --jobs 1

      - name: Print Nuitka version
        run: uv run --frozen python -m nuitka --version

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          sed -i 's/\r$//' scripts/ci/build_appimage.sh
          chmod +x scripts/ci/build_appimage.sh
          scripts/ci/build_appimage.sh "${{ github.ref_name }}" dist/nuitka dist/release ./appimagetool

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/release/*.AppImage

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist/release

      - name: Generate latest.json manifest
        run: |
          tag="${{ github.ref_name }}"
          installer="dist/release/Cheremsha-Setup-${tag}.exe"
          zip="dist/release/Cheremsha-${tag}-windows-x64-portable.zip"
          appimage="dist/release/Cheremsha-${tag}-linux-x86_64.AppImage"
          python scripts/ci/generate_latest_json.py \
            --tag "$tag" \
            --repo "${{ github.repository }}" \
            --installer-path "$installer" \
            --portable-zip-path "$zip" \
            --appimage-path "$appimage" \
            --out "dist/release/latest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cheremsha ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.AppImage
            dist/release/latest.json
