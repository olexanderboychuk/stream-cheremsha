name: Renew & Upload SSL Certificates to Workers KV

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  renew-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh
          ~/.acme.sh/acme.sh --set-default-ca --server letsencrypt

      - name: Issue SSL Certificate
        env:
          CF_Token: ${{ secrets.CF_API_TOKEN }}
        run: |
          ~/.acme.sh/acme.sh --issue --dns dns_cf \
            -d "cheremsha.click" \
            -d "*.cheremsha.click"

      - name: Upload Certificates to Cloudflare KV
        run: |
          set -euo pipefail
          curl --fail-with-body -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/cert.pem" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@${HOME}/.acme.sh/cheremsha.click_ecc/fullchain.cer"

          curl --fail-with-body -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE_ID }}/values/key.pem" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@${HOME}/.acme.sh/cheremsha.click_ecc/cheremsha.click.key"
